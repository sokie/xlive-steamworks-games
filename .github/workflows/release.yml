name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure
        run: cmake -B build -A Win32 -DXLS_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Pack the release folders
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "" }
          powershell -NoProfile -File tools/make_release.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: xlive-steamworks-games
          path: release/zips/*

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists, its assets stay as published"
            exit 0
          }
          $files = Get-ChildItem release/zips -File | ForEach-Object { $_.FullName }
          gh release create $tag $files --title $tag --generate-notes --verify-tag
